name: Secret Scan

# Fulfils the "CI | secret scan on the pull request" commitment made in
# SECURITY.md (Detection section). Separate from ci.yml (validate/deploy)
# since its scope and permissions are different: it scans the git history
# of the PR's commits, not the repository's content or configuration.
#
# Free on public repositories (this repo), no license key needed.

on:
  pull_request:

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # pull-requests: write lets the action comment directly on the PR
      # when it finds something, in addition to failing the check.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Full history, not just the merge commit: gitleaks scans every
          # commit introduced by the PR, including ones later amended out
          # of the visible diff.

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
