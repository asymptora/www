name: Secret Scan

# Fulfils the "CI | secret scan on the pull request" commitment made in
# SECURITY.md (Detection section). Separate from ci.yml (validate/deploy)
# since its scope is different: it scans git history, not repo content
# or configuration.
#
# Runs the open-source gitleaks CLI directly, not the gitleaks-action
# wrapper: the wrapper requires a paid license for any organization
# account (public or private), while the CLI itself is free and
# license-free for everyone. This avoids a third-party account signup
# and an extra secret to manage, at the cost of losing the wrapper's
# automatic PR-comment feature — a failed check already surfaces the
# finding.

on:
  pull_request:

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Full history, not just the merge commit: gitleaks needs the
          # actual commit history to scan every commit the PR introduces.

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --redact --verbose
        # --redact: never prints the actual secret value in CI logs, only
        # its location, even when a real finding occurs.
