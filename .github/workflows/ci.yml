name: CI/CD

# Validate every pull request; deploy only on push to main.
# Each job declares its own permissions explicitly (RFC 0001, decision 2) —
# nothing here inherits a broader default.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Check for broken internal links
        # Tested against a running wrangler dev server, not the file
        # system directly: linkinator over public/index.html cannot
        # resolve clean URLs like /about to about.html (that resolution
        # is the Worker's html_handling behaviour, not a filesystem
        # fact), so it reported false 404s for every clean-URL page.
        # wrangler dev is started and the check run in the same step,
        # since a backgrounded process does not carry over between
        # GitHub Actions steps (each is its own shell).
        run: |
          npx wrangler dev --port 8787 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8787 > /dev/null && break
            sleep 1
          done
          npx linkinator http://localhost:8787 --recurse --skip '^https?://(?!127\.0\.0\.1|localhost)'

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
