name: CI/CD

# Validate every pull request; deploy only on push to main.
# Each job declares its own permissions explicitly (RFC 0001, decision 2) —
# nothing here inherits a broader default.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Check design tokens
        # Regenerates nothing: compares public/tokens.css with what
        # design/tokens.json would generate, rejects literal colours outside
        # tokens.css, and checks dot-grid-color against ink (ADR 0006).
        run: node design/build/tokens.mjs --check

      - name: Check logo and favicon files
        # Structure only: the Python scripts that generate these files do not
        # run in CI (ADR 0006 and design/build/README.md). Checks the lambda
        # path, the ICO and Apple icon sizes, and that no SVG, PNG or ICO
        # carries a metadata block or a C2PA marker.
        run: node design/build/check-assets.mjs

      - name: Check shared markup
        # Parity between pages: every page under public/ must be exactly what
        # design/build/apply-shared-markup.mjs would write (canonical header,
        # head links, body tag), and the footers must be identical. Writes
        # nothing; on failure it says which page differs and how to fix it.
        run: node design/build/apply-shared-markup.mjs --check

      - name: Check page and stylesheet rules
        # ADR 0010. What a hand edit of a page or of style.css could silently break: no
        # <script> or inline handler (ADR 0007), no <style> or style= (rules
        # live in style.css), nothing authored loads from outside the site,
        # and text contrast on the page background of at least 4.5:1,
        # computed from design/tokens.json. Source files only: it does not
        # see what Cloudflare injects at the edge.
        run: node design/build/check-invariants.mjs

      - name: Validate wrangler config
        # Catches wrangler.jsonc syntax/config errors on the PR, before
        # merge — previously these only surfaced at actual deploy time,
        # after landing on main.
        run: npx wrangler deploy --dry-run

      - name: Check for broken internal links
        # Tested against a running wrangler dev server, not the file
        # system directly: linkinator over public/index.html cannot
        # resolve clean URLs like /about to about.html (that resolution
        # is the Worker's html_handling behaviour, not a filesystem
        # fact), so it reported false 404s for every clean-URL page.
        # wrangler dev is started and the check run in the same step,
        # since a backgrounded process does not carry over between
        # GitHub Actions steps (each is its own shell).
        run: |
          npx wrangler dev --port 8787 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8787 > /dev/null && break
            sleep 1
          done
          npx linkinator http://localhost:8787 --recurse --skip '^https?://(?!127\.0\.0\.1|localhost)'

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
