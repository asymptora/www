name: CI/CD

# Validate every pull request; deploy only on push to main.
# Each job declares its own permissions explicitly (RFC 0001, decision 2) —
# nothing here inherits a broader default.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Check for broken internal links
        # linkinator serves local files through a temporary localhost server,
        # so every link — even internal ones — appears as an http(s):// URL
        # while scanning. The --skip pattern therefore excludes real external
        # hosts only, not 127.0.0.1/localhost, or every link would be skipped
        # (verified locally: an unqualified "^https?://" skip reports 0 links
        # scanned). This keeps external sites out of CI (issue #8) without
        # skipping the scan itself.
        run: npx linkinator public/index.html --recurse --skip '^https?://(?!127\.0\.0\.1|localhost)'

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
